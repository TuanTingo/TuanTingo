  <style>
    /* Khóa cuộn trang tuyệt đối để luôn vừa vặn 1 màn hình (Zero-Scroll) */
    html, body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1120;
      margin: 0;
      padding: 0;
      color: #1e293b;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    /* Hiệu ứng nhấp nháy phát sáng cam đậm (#D94800) làm nổi bật */
    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(217, 72, 0, 0.8), 0 4px 14px rgba(255, 102, 0, 0.4);
      }
      70% {
        box-shadow: 0 0 0 11px rgba(217, 72, 0, 0), 0 4px 14px rgba(255, 102, 0, 0.4);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(217, 72, 0, 0), 0 4px 14px rgba(255, 102, 0, 0.4);
      }
    }

    .guide-highlight {
      border: 2.5px solid #D94800 !important;
      animation: pulse-ring 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
      position: relative;
    }

    /* Tag nhãn chỉ dẫn nổi bật */
    .guide-callout {
      position: absolute;
      background: linear-gradient(135deg, #FF6600, #D94800);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 2.5px 9px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 10px rgba(217, 72, 0, 0.5);
      white-space: nowrap;
      z-index: 30;
      pointer-events: none;
    }

    /* Tùy biến dropdown chọn ngôn ngữ */
    .custom-lang-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 0.85em;
      padding-right: 1.9rem;
    }

    .app-main::-webkit-scrollbar { display: none; }
    .app-main { -ms-overflow-style: none; scrollbar-width: none; }

    /* =================================================== */
    /* CẤU TRÚC PHÂN CHIA CHẾ ĐỘ MOBILE & DESKTOP          */
    /* =================================================== */
    #mobile-view-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    #desktop-view-root {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .mobile-stage {
      width: 430px;
      height: 900px;
      transform-origin: top center;
      margin: 0 auto;
      transition: transform 0.12s ease-out;
      flex-shrink: 0;
    }

    .desktop-stage-canvas {
      width: 2350px;
      height: 990px;
      transform-origin: top center;
      position: absolute;
      top: 0;
      left: 50%;
      margin-left: -1175px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 32px;
    }

    .phone-mockup-frame {
      width: 430px;
      height: 900px;
      flex-shrink: 0;
    }
  </style>
</head>

        btn_register: "가입하기",
        step4_guide: "6자리 보안 비밀번호를 입력하고 확인한 후 <strong>“가입하기”</strong>를 누르세요.",
        success_title: "가입이 완료되었습니다!",
        success_desc: "Tingo Pay 결제 생태계에 오신 것을 환영합니다.",
        btn_home_tingo: "Tingo Pay 홈",
        step5_guide: "완료 화면이 나타나면 <strong>“Tingo Pay 홈”</strong>을 눌러 서비스를 시작하세요."
      }
    };

    // 2. HÀM THỰC THI CHUYỂN NGÔN NGỮ
    function setLanguage(lang) {
      if (!translations[lang]) return;
      currentLang = lang;
      const dict = translations[lang];

      // Đồng bộ giá trị dropdown Desktop và Mobile
      document.querySelectorAll('.lang-select-elem').forEach(el => {
        el.value = lang;
      });

      // Cập nhật text đơn thuần có data-i18n
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.innerHTML = dict[key];
        }
      });

      // Cập nhật tiêu đề các bước Desktop
      for (let i = 1; i <= 5; i++) {
        const titleEl = document.querySelector(`.step-title-d-${i}`);
        if (titleEl && dict.steps[i - 1]) {
          titleEl.innerText = dict.steps[i - 1];
        }
      }

      // Cập nhật tiêu đề thanh tiến trình Mobile
      const mobStepText = document.getElementById('step-indicator-text');
      if (mobStepText) {
        mobStepText.innerText = dict.steps[currentStep - 1];
      }
    }

    // 3. KHỞI TẠO VÀ RENDER THÀNH PHẦN
    function initializeComponents() {
      const statusBarHtml = document.getElementById('tpl-status-bar').innerHTML;
      const homeBarHtml = document.getElementById('tpl-home-bar').innerHTML;

      // Render 5 bước cho Mobile
      for (let i = 1; i <= 5; i++) {
        const mContainer = document.getElementById(`m-step-${i}`);
        if (mContainer) mContainer.innerHTML = document.getElementById(`tpl-step-${i}`).innerHTML;
      }

      // Render 5 thiết bị cho Desktop Panorama
      for (let i = 1; i <= 5; i++) {
        const dDevice = document.getElementById(`d-device-${i}`);
        if (dDevice) dDevice.innerHTML = statusBarHtml + document.getElementById(`tpl-step-${i}`).innerHTML + homeBarHtml;
      }
    }

    // 4. ĐIỀU HƯỚNG BƯỚC TRÊN MOBILE
    function goToStep(step) {
      if (step < 1 || step > totalSteps) return;
      currentStep = step;

      for (let i = 1; i <= totalSteps; i++) {
        const el = document.getElementById(`m-step-${i}`);
        if (el) el.classList.toggle('hidden', i !== currentStep);
      }

      const progressPercent = (currentStep / totalSteps) * 100;
      document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;
      document.getElementById('step-indicator-text').innerText = translations[currentLang].steps[currentStep - 1];
      document.getElementById('step-percentage-text').innerText = `${progressPercent}%`;

      document.getElementById('nav-btn-prev').disabled = (currentStep === 1);
      document.getElementById('nav-btn-next').disabled = (currentStep === totalSteps);

      const currentSection = document.getElementById(`m-step-${currentStep}`);
      if (currentSection) {
        const mainEl = currentSection.querySelector('main');
        if (mainEl) mainEl.scrollTop = 0;
      }
    }

    function navigateStep(direction) {
      goToStep(currentStep + direction);
    }

    // 5. XỬ LÝ VUỐT (SWIPE) TRÊN MOBILE
    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
    const gestureZone = document.getElementById('screen-stage');

    gestureZone.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    gestureZone.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 45) {
        if (deltaX < 0 && currentStep < totalSteps) navigateStep(1);
        else if (deltaX > 0 && currentStep > 1) navigateStep(-1);
      }
    }, { passive: true });

    // 6. PHÁT HIỆN THIẾT BỊ VÀ ĐIỀU CHỈNH TỶ LỆ CO GIÃN THÔNG MINH (ĐÃ SỬA CHUẨN SCALE MOBILE)
    function handleDeviceDetectionAndScale() {
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      isDesktopMode = (screenW >= 1024);

      const mobileRoot = document.getElementById('mobile-view-root');
      const desktopRoot = document.getElementById('desktop-view-root');

      if (isDesktopMode) {
        // --- CHẾ ĐỘ MÁY TÍNH (DESKTOP) ---
        mobileRoot.style.display = 'none';
        desktopRoot.style.display = 'flex';
        desktopRoot.style.flexDirection = 'column';

        const headerBar = document.getElementById('desktop-header-bar');
        const canvas = document.getElementById('desktop-canvas');

        const baseCanvasWidth = 2350;
        const baseCanvasHeight = 990;

        const availableW = screenW - 32;
        const availableH = screenH - headerBar.offsetHeight - 24;

        const scaleX = availableW / baseCanvasWidth;
        const scaleY = availableH / baseCanvasHeight;
        const scale = Math.min(scaleX, scaleY);

        canvas.style.transform = `scale(${scale})`;
        const renderedHeight = baseCanvasHeight * scale;
        const topOffset = Math.max(8, (availableH - renderedHeight) / 2);
        canvas.style.top = topOffset + 'px';

      } else {
        // --- CHẾ ĐỘ ĐIỆN THOẠI (MOBILE) ---
        desktopRoot.style.display = 'none';
        mobileRoot.style.display = 'flex';

        const controlBar = document.getElementById('mobile-control-bar');
        const fit = document.getElementById('screen-fit');
        const stage = document.getElementById('screen-stage');

        const baseWidth = 430;
        const baseHeight = 900;

        const availableWidth = screenW - 12;
        // Chừa khoảng đệm an toàn cho thanh header và thanh địa chỉ Safari bên dưới
        const controlH = controlBar ? controlBar.offsetHeight : 52;
        const availableHeight = screenH - controlH - 18;

        const scaleX = availableWidth / baseWidth;
        const scaleY = availableHeight / baseHeight;
        const scale = Math.min(scaleX, scaleY, 1);

        stage.style.transform = `scale(${scale})`;
        fit.style.height = (baseHeight * scale) + 'px';
      }
    }

    window.addEventListener('resize', handleDeviceDetectionAndScale);
    window.addEventListener('orientationchange', () => {
      setTimeout(handleDeviceDetectionAndScale, 150);
    });

    window.addEventListener('DOMContentLoaded', () => {
      initializeComponents();
      handleDeviceDetectionAndScale();
      goToStep(1);
      setLanguage('vi');
      // Ép tính toán lại lần 2 sau khi font và bố cục trình duyệt ổn định
      setTimeout(handleDeviceDetectionAndScale, 100);
    });
  </script>
