<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tingo Pay - Hướng Dẫn Liên Kết BIDV</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome 6.4.0 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tingo: {
              orange: '#FF6600',
              'orange-dark': '#D94800',
              navy: '#1A365D',
              blue: '#0038A8',
              deep: '#00226E',
              link: '#007aff',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Khóa cuộn trang tuyệt đối để luôn vừa vặn 1 màn hình (Zero-Scroll) */
    html, body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      margin: 0;
      padding: 0;
      color: #1e293b;
      height: 100dvh;
      overflow: hidden;
    }

    /* Vòng tròn nhấp nháy phát sáng cam đậm (#D94800) */
    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(217, 72, 0, 0.75), 0 4px 14px rgba(255, 102, 0, 0.35);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(217, 72, 0, 0), 0 4px 14px rgba(255, 102, 0, 0.35);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(217, 72, 0, 0), 0 4px 14px rgba(255, 102, 0, 0.35);
      }
    }

    .guide-highlight {
      border: 2.5px solid #D94800 !important;
      animation: pulse-ring 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
      position: relative;
      cursor: pointer;
    }

    /* Tag nhãn chỉ dẫn hướng dẫn */
    .guide-callout {
      position: absolute;
      background: linear-gradient(135deg, #FF6600, #D94800);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 8px rgba(217, 72, 0, 0.45);
      white-space: nowrap;
      z-index: 30;
      pointer-events: none;
    }

    /* Tab active */
    .tab-btn.active {
      border-color: #007aff !important;
      background-color: #ffffff !important;
    }
    .tab-btn.active .tab-title {
      color: #007aff !important;
      font-weight: 700 !important;
    }
    .tab-btn.active .tab-icon {
      color: #007aff !important;
    }
    .tab-btn.active .tab-check {
      display: flex !important;
    }

    /* Hiệu ứng trôi nhẹ cho kính lúp ở giữa */
    @keyframes lens-float {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }

    .magnifier-center-wrap {
      animation: lens-float 3s ease-in-out infinite;
      filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.3));
    }

    .app-main::-webkit-scrollbar { display: none; }
    .app-main { -ms-overflow-style: none; scrollbar-width: none; }

    /* =================================================== */
    /* CẤU TRÚC PHÂN CHIA CHẾ ĐỘ MOBILE & DESKTOP          */
    /* =================================================== */
    #mobile-view-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    #desktop-view-root {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .mobile-stage {
      width: 430px;
      height: 900px;
      transform-origin: top center;
      margin: 0 auto;
      transition: transform 0.12s ease-out;
      flex-shrink: 0;
    }

    /* Sân khấu toàn cảnh Desktop (5 thiết bị dàn ngang) */
    .desktop-stage-canvas {
      width: 2400px;
      height: 1030px;
      transform-origin: top center;
      position: absolute;
      top: 0;
      left: 50%;
      margin-left: -1200px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 36px;
    }

    .phone-mockup-frame {
      width: 430px;
      height: 900px;
      flex-shrink: 0;
    }

    /* Dropdown Options Hover & Selected */
    .custom-lang-opt.active {
      background-color: rgba(255, 102, 0, 0.15);
      color: #FF6600;
      font-weight: 700;
    }
  </style>
</head>
<body class="select-none">

  <!-- =================================================================== -->
  <!-- 1. GIAO DIỆN CHẾ ĐỘ ĐIỆN THOẠI (HIỂN THỊ KHI XEM TRÊN MOBILE)      -->
  <!-- =================================================================== -->
  <div id="mobile-view-root" class="px-2 py-1">
    
    <!-- THANH TIẾN TRÌNH & NÚT ĐIỀU HƯỚNG PREVIOUS / NEXT + CUSTOM DROPDOWN ĐẦY ĐỦ CỜ & TÊN -->
    <header id="mobile-control-bar" class="max-w-[430px] w-full mb-1.5 px-3 py-1.5 bg-slate-800/95 border border-slate-700/80 rounded-2xl shadow-lg flex items-center justify-between gap-2 shrink-0 z-50 relative">
      <!-- Nút Prev -->
      <button id="nav-btn-prev" onclick="navigateStep(-1)" class="w-8 h-8 rounded-xl bg-slate-700/80 hover:bg-slate-600 text-white flex items-center justify-center transition active:scale-95 disabled:opacity-30 disabled:pointer-events-none shrink-0">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </button>

      <!-- Tiến trình -->
      <div class="flex-1 flex flex-col items-center px-1">
        <div class="w-full flex justify-between items-center text-[10px] font-semibold text-slate-300 mb-0.5">
          <span id="step-indicator-text" class="truncate pr-1">Bước 1: Thêm tài khoản</span>
          <span id="step-percentage-text" class="text-tingo-orange font-bold shrink-0">20%</span>
        </div>
        <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden p-[1px]">
          <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-tingo-orange to-tingo-orange-dark rounded-full transition-all duration-300 w-1/5"></div>
        </div>
      </div>

      <!-- Nút Next -->
      <button id="nav-btn-next" onclick="navigateStep(1)" class="w-8 h-8 rounded-xl bg-tingo-orange hover:bg-tingo-orange-dark text-white flex items-center justify-center transition active:scale-95 shadow-md disabled:opacity-30 disabled:pointer-events-none shrink-0">
        <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>

      <!-- CUSTOM DROPDOWN NGÔN NGỮ MOBILE: CÓ CỜ SVG VÀ TÊN ĐẦY ĐỦ, NẰM NGOÀI APP -->
      <div class="relative shrink-0 pl-1 border-l border-slate-700">
        <button id="mobile-lang-trigger" onclick="toggleLangMenu('mobile')" class="flex items-center space-x-1.5 bg-slate-700/90 hover:bg-slate-600 text-white text-[11px] font-bold py-1 px-2 rounded-xl border border-slate-600 focus:outline-none transition active:scale-95">
          <i class="fa-solid fa-globe text-amber-400 text-xs"></i>
          <span id="m-active-flag" class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0"></span>
          <span id="m-active-name" class="hidden sm:inline">Tiếng Việt</span>
          <i class="fa-solid fa-chevron-down text-[8px] text-slate-400"></i>
        </button>

        <!-- Menu Dropdown Popover Mobile -->
        <div id="mobile-lang-menu" class="hidden absolute right-0 top-full mt-2 w-44 bg-slate-800/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700 p-1.5 z-50 space-y-1">
          <button onclick="selectLanguage('vi')" class="custom-lang-opt w-full flex items-center space-x-2.5 px-2.5 py-1.5 rounded-xl text-left text-xs font-semibold text-slate-200 hover:bg-slate-700/80 transition" data-lang="vi">
            <span class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0 shadow-xs"><svg class="w-full h-full" viewBox="0 0 30 20"><rect width="30" height="20" fill="#da251d"/><polygon points="15,4 17.5,12 11,7 19,7 12.5,12" fill="#ff0"/></svg></span>
            <span>Tiếng Việt</span>
          </button>
          <button onclick="selectLanguage('en')" class="custom-lang-opt w-full flex items-center space-x-2.5 px-2.5 py-1.5 rounded-xl text-left text-xs font-semibold text-slate-200 hover:bg-slate-700/80 transition" data-lang="en">
            <span class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0 shadow-xs"><svg class="w-full h-full" viewBox="0 0 30 20"><rect width="30" height="20" fill="#012169"/><path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="3"/><path d="M0,0 L30,20 M30,0 L0,20" stroke="#c8102e" stroke-width="1.8"/><path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="5"/><path d="M15,0 V20 M0,10 H30" stroke="#c8102e" stroke-width="3"/></svg></span>
            <span>English</span>
          </button>
          <button onclick="selectLanguage('cn')" class="custom-lang-opt w-full flex items-center space-x-2.5 px-2.5 py-1.5 rounded-xl text-left text-xs font-semibold text-slate-200 hover:bg-slate-700/80 transition" data-lang="cn">
            <span class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0 shadow-xs"><svg class="w-full h-full" viewBox="0 0 30 20"><rect width="30" height="20" fill="#de2910"/><polygon points="5,3 6,6 3,4 7,4 4,6" fill="#ffde00"/><polygon points="10,2 10.5,3.2 9.5,2.5 10.8,2.5 9.8,3.2" fill="#ffde00"/><polygon points="12,4 12.5,5.2 11.5,4.5 12.8,4.5 11.8,5.2" fill="#ffde00"/></svg></span>
            <span>简体中文</span>
          </button>
          <button onclick="selectLanguage('kr')" class="custom-lang-opt w-full flex items-center space-x-2.5 px-2.5 py-1.5 rounded-xl text-left text-xs font-semibold text-slate-200 hover:bg-slate-700/80 transition" data-lang="kr">
            <span class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0 shadow-xs"><svg class="w-full h-full bg-white" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5" fill="#cd2e3a"/><path d="M10,10 A5,5 0 0,0 20,10 A2.5,2.5 0 0,0 15,10 A2.5,2.5 0 0,1 10,10" fill="#0047a0"/></svg></span>
            <span>한국어</span>
          </button>
        </div>
      </div>
    </header>

    <!-- KHUNG ĐIỆN THOẠI MOBILE (TỰ ĐỘNG THU NHỎ VỪA KHÍT 100DVH) -->
    <div id="screen-fit" class="w-full flex-1 flex justify-center items-start overflow-hidden relative">
      <div id="screen-stage" class="mobile-stage bg-white rounded-[44px] shadow-2xl border-[8px] border-slate-900 overflow-hidden flex flex-col relative">
        
        <!-- Status bar iOS Mobile -->
        <div class="pt-3 px-7 pb-2 flex justify-between items-center text-slate-900 bg-white z-30 shrink-0">
          <span class="text-sm font-semibold tracking-tight">09:41</span>
          <div class="w-24 h-4 bg-slate-900 rounded-full mx-auto"></div>
          <div class="flex items-center space-x-1.5 text-xs">
            <i class="fa-solid fa-signal text-[11px]"></i>
            <i class="fa-solid fa-wifi text-[11px]"></i>
            <div class="flex items-center space-x-0.5 ml-1">
              <div class="w-5 h-2.5 border border-slate-900 rounded-xs p-[1px] flex items-center">
                <div class="bg-emerald-500 h-full w-[98%] rounded-[1px]"></div>
              </div>
              <div class="w-0.5 h-1 bg-slate-900 rounded-r-xs"></div>
            </div>
          </div>
        </div>

        <!-- Vùng chứa các bước màn hình Mobile -->
        <div id="mobile-step-container" class="flex-1 flex flex-col overflow-hidden relative">
          <div id="m-step-1" class="step-card flex-1 flex flex-col overflow-hidden"></div>
          <div id="m-step-2" class="step-card flex-1 flex flex-col overflow-hidden hidden"></div>
          <div id="m-step-3" class="step-card flex-1 flex flex-col overflow-hidden hidden"></div>
          <div id="m-step-4" class="step-card flex-1 flex flex-col overflow-hidden hidden"></div>
          <div id="m-step-5" class="step-card flex-1 flex flex-col overflow-hidden hidden"></div>
        </div>

        <!-- Floating Button (+) Mobile -->
        <div id="m-fab-plus" class="absolute right-5 bottom-20 z-30 pointer-events-auto">
          <button class="w-12 h-12 rounded-full bg-[#1877F2] hover:bg-blue-600 text-white shadow-xl flex items-center justify-center text-xl active:scale-95 transition-all">
            <i class="fa-solid fa-plus font-light"></i>
          </button>
        </div>

        <!-- Dock Điều Hướng Mobile -->
        <nav id="m-bottom-dock" class="h-16 bg-white border-t border-slate-200/80 px-4 flex items-center justify-around z-20 shrink-0 relative">
          <button class="w-[52px] h-[44px] rounded-2xl bg-[#dbeafe] flex items-center justify-center text-[#0284c7]">
            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h16a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3H4zm0 2h16a1 1 0 0 1 1 1v1H3V8a1 1 0 0 1 1-1zm-1 5h18v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4zm3 2a1 1 0 0 0 0 2h3a1 1 0 1 0 0-2H6z"/></svg>
          </button>
          <button class="w-[52px] h-[44px] flex items-center justify-center text-slate-400"><i class="fa-regular fa-newspaper text-lg"></i></button>
          <button class="w-[52px] h-[44px] flex items-center justify-center text-[#0d9488]"><div class="border-2 border-dashed border-[#0d9488] p-1 rounded-md"><i class="fa-solid fa-qrcode text-lg"></i></div></button>
          <button class="w-[52px] h-[44px] flex items-center justify-center text-slate-400"><i class="fa-solid fa-clipboard-check text-lg"></i></button>
          <button class="w-[52px] h-[44px] flex items-center justify-center text-slate-400"><i class="fa-solid fa-store text-lg"></i></button>
        </nav>

        <!-- Home Bar iPhone Mobile -->
        <div class="bg-white pb-2 pt-1 flex justify-center z-20 shrink-0">
          <div class="w-32 h-1 bg-slate-900 rounded-full"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- =================================================================== -->
  <!-- 2. GIAO DIỆN CHẾ ĐỘ MÁY TÍNH (PANORAMA DESKTOP VIEW - 5 GIAO DIỆN)  -->
  <!-- =================================================================== -->
  <div id="desktop-view-root">
    <!-- Header máy tính: CHỮ TO, KHÔNG TRÀN VIỀN + CUSTOM DROPDOWN ICON ĐỊA CẦU -->
    <div id="desktop-header-bar" class="w-full py-3 px-8 flex justify-between items-center border-b border-slate-800 bg-slate-900/95 backdrop-blur z-50 shrink-0">
      <div class="flex items-center space-x-4 min-w-0">
        <img src="https://lh3.googleusercontent.com/d/1cE6RCe1tQq0QxXSbz0zLr9LvPgyrSS9x" alt="Tingo Pay" class="h-9 object-contain shrink-0" />
        <span class="text-base lg:text-lg font-black text-slate-200 tracking-wide truncate">
          <span class="text-slate-500 mr-2 font-normal">|</span>
          <span data-i18n="doc_title">HƯỚNG DẪN LIÊN KẾT TÀI KHOẢN BIDV</span>
        </span>
      </div>

      <!-- CUSTOM DROPDOWN NGÔN NGỮ DESKTOP KÈM ICON ĐỊA CẦU, CỜ SVG & TÊN ĐẦY ĐỦ -->
      <div class="relative shrink-0 pl-4">
        <button id="desktop-lang-trigger" onclick="toggleLangMenu('desktop')" class="flex items-center space-x-2.5 bg-slate-800/90 hover:bg-slate-700 text-white text-xs font-bold py-1.5 px-3 rounded-xl border border-slate-700 hover:border-slate-500 focus:outline-none shadow-sm transition active:scale-95">
          <i class="fa-solid fa-globe text-base text-amber-400"></i>
          <span id="d-active-flag" class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0 shadow-2xs"></span>
          <span id="d-active-name">Tiếng Việt</span>
          <i class="fa-solid fa-chevron-down text-[9px] text-slate-400"></i>
        </button>

        <!-- Menu Dropdown Popover Desktop -->
        <div id="desktop-lang-menu" class="hidden absolute right-0 top-full mt-2 w-48 bg-slate-800/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700 p-2 z-50 space-y-1">
          <button onclick="selectLanguage('vi')" class="custom-lang-opt w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-left text-xs font-semibold text-slate-200 hover:bg-slate-700/80 transition" data-lang="vi">
            <span class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0 shadow-xs"><svg class="w-full h-full" viewBox="0 0 30 20"><rect width="30" height="20" fill="#da251d"/><polygon points="15,4 17.5,12 11,7 19,7 12.5,12" fill="#ff0"/></svg></span>
            <span>Tiếng Việt</span>
          </button>
          <button onclick="selectLanguage('en')" class="custom-lang-opt w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-left text-xs font-semibold text-slate-200 hover:bg-slate-700/80 transition" data-lang="en">
            <span class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0 shadow-xs"><svg class="w-full h-full" viewBox="0 0 30 20"><rect width="30" height="20" fill="#012169"/><path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="3"/><path d="M0,0 L30,20 M30,0 L0,20" stroke="#c8102e" stroke-width="1.8"/><path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="5"/><path d="M15,0 V20 M0,10 H30" stroke="#c8102e" stroke-width="3"/></svg></span>

            <span>简体中文</span>

          <button onclick="selectLanguage('kr')" class="custom-lang-opt w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-left text-xs font-semibold text-slate-200 hover:bg-slate-700/80 transition" data-lang="kr">
            <span class="w-4 h-3 rounded-2xs overflow-hidden flex items-center justify-center shrink-0 shadow-xs"><svg class="w-full h-full bg-white" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5" fill="#cd2e3a"/><path d="M10,10 A5,5 0 0,0 20,10 A2.5,2.5 0 0,0 15,10 A2.5,2.5 0 0,1 10,10" fill="#0047a0"/></svg></span>
            <span>한국어</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Sân khấu co giãn máy tính chứa cả 5 thiết bị -->
    <div id="desktop-scale-container" class="w-full flex-1 relative overflow-hidden">
      <div id="desktop-canvas" class="desktop-stage-canvas">
        
        <!-- Cột 1: Bước 1 -->
        <div class="flex flex-col items-center">
          <div class="mb-4 px-5 py-2.5 rounded-full bg-slate-800 border-2 border-tingo-orange/80 text-tingo-orange text-base font-extrabold shadow-lg flex items-center space-x-2.5 whitespace-nowrap">

          <div id="d-device-1" class="phone-mockup-frame bg-white rounded-[44px] shadow-2xl border-[8px] border-slate-900 overflow-hidden flex flex-col relative"></div>
        </div>

        <!-- Cột 2: Bước 2 -->
        <div class="flex flex-col items-center">
          <div class="mb-4 px-5 py-2.5 rounded-full bg-slate-800 border-2 border-sky-500/80 text-sky-400 text-base font-extrabold shadow-lg flex items-center space-x-2.5 whitespace-nowrap">
            <span class="w-7 h-7 rounded-full bg-sky-500 text-white flex items-center justify-center text-sm font-black shadow-sm">2</span>
            <span class="step-title-d-2">Bước 2: Nhập thông tin liên kết</span>

        <div class="flex flex-col items-center">
          <div class="mb-4 px-5 py-2.5 rounded-full bg-slate-800 border-2 border-amber-500/80 text-amber-400 text-base font-extrabold shadow-lg flex items-center space-x-2.5 whitespace-nowrap">
            <span class="w-7 h-7 rounded-full bg-amber-500 text-white flex items-center justify-center text-sm font-black shadow-sm">3</span>
            <span class="step-title-d-3">Bước 3: Xác nhận điều khoản dịch vụ</span>
          </div>
          <div id="d-device-3" class="phone-mockup-frame bg-white rounded-[44px] shadow-2xl border-[8px] border-slate-900 overflow-hidden flex flex-col relative"></div>
        </div>

        <!-- Cột 4: Bước 4 -->

    // 2. SVG FLAGS & TÊN ĐẦY ĐỦ
    const flagSvgs = {
      vi: '<svg class="w-full h-full" viewBox="0 0 30 20"><rect width="30" height="20" fill="#da251d"/><polygon points="15,4 17.5,12 11,7 19,7 12.5,12" fill="#ff0"/></svg>',
      en: '<svg class="w-full h-full" viewBox="0 0 30 20"><rect width="30" height="20" fill="#012169"/><path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="3"/><path d="M0,0 L30,20 M30,0 L0,20" stroke="#c8102e" stroke-width="1.8"/><path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="5"/><path d="M15,0 V20 M0,10 H30" stroke="#c8102e" stroke-width="3"/></svg>',
      cn: '<svg class="w-full h-full" viewBox="0 0 30 20"><rect width="30" height="20" fill="#de2910"/><polygon points="5,3 6,6 3,4 7,4 4,6" fill="#ffde00"/><polygon points="10,2 10.5,3.2 9.5,2.5 10.8,2.5 9.8,3.2" fill="#ffde00"/><polygon points="12,4 12.5,5.2 11.5,4.5 12.8,4.5 11.8,5.2" fill="#ffde00"/></svg>',
      kr: '<svg class="w-full h-full bg-white" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5" fill="#cd2e3a"/><path d="M10,10 A5,5 0 0,0 20,10 A2.5,2.5 0 0,0 15,10 A2.5,2.5 0 0,1 10,10" fill="#0047a0"/></svg>'
    };

    const langNames = {
      vi: 'Tiếng Việt',
      en: 'English',
      cn: '简体中文',
      kr: '한국어'
    };

    // 3. LOGIC CUSTOM DROPDOWN POPOVER
    function toggleLangMenu(type) {
      const menu = document.getElementById(type === 'mobile' ? 'mobile-lang-menu' : 'desktop-lang-menu');
      if (!menu) return;
      const isClosed = menu.classList.contains('hidden');
      closeAllLangMenus();
      if (isClosed) {
        menu.classList.remove('hidden');
      }
    }

    function closeAllLangMenus() {
      const mMenu = document.getElementById('mobile-lang-menu');
      const dMenu = document.getElementById('desktop-lang-menu');
      if (mMenu) mMenu.classList.add('hidden');
      if (dMenu) dMenu.classList.add('hidden');
    }

    // Đóng dropdown khi click ra ngoài
    document.addEventListener('click', (e) => {
      const isDropdownClick = e.target.closest('#mobile-lang-trigger') || 
                              e.target.closest('#desktop-lang-trigger') || 
                              e.target.closest('#mobile-lang-menu') || 
                              e.target.closest('#desktop-lang-menu');
      if (!isDropdownClick) {
        closeAllLangMenus();
      }
    });

    function selectLanguage(lang) {
      closeAllLangMenus();
      setLanguage(lang);
    }

    // 4. HÀM THỰC THI CHUYỂN NGÔN NGỮ ĐỒNG BỘ
    function setLanguage(lang) {
      if (!translations[lang]) return;
      currentLang = lang;
      const dict = translations[lang];

      // Cập nhật button trigger Desktop
      const dFlag = document.getElementById('d-active-flag');
      const dName = document.getElementById('d-active-name');
      if (dFlag) dFlag.innerHTML = flagSvgs[lang];
      if (dName) dName.innerText = langNames[lang];

      // Cập nhật button trigger Mobile
      const mFlag = document.getElementById('m-active-flag');
      const mName = document.getElementById('m-active-name');
      if (mFlag) mFlag.innerHTML = flagSvgs[lang];
      if (mName) mName.innerText = langNames[lang];

      // Cập nhật active class trong menu
      document.querySelectorAll('.custom-lang-opt').forEach(opt => {
        opt.classList.toggle('active', opt.getAttribute('data-lang') === lang);
      });

      // Cập nhật text có data-i18n
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.innerHTML = dict[key];
        }
      });

      // Cập nhật placeholder
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        if (dict[key]) {
          el.setAttribute('placeholder', dict[key]);
        }
      });

      // Cập nhật tiêu đề các bước Desktop
      for (let i = 1; i <= 5; i++) {
        const titleEl = document.querySelector(`.step-title-d-${i}`);
        if (titleEl && dict.steps[i - 1]) {
          titleEl.innerText = dict.steps[i - 1];
        }
      }

      // Cập nhật tiêu đề thanh tiến trình Mobile
      const mobStepText = document.getElementById('step-indicator-text');
      if (mobStepText) {
        mobStepText.innerText = dict.steps[currentStep - 1];
      }
    }

    // Khởi tạo component
    function initializeComponents() {
      const statusBarHtml = document.getElementById('tpl-status-bar').innerHTML;
      const homeBarHtml = document.getElementById('tpl-home-bar').innerHTML;

      for (let i = 1; i <= 5; i++) {
        const mContainer = document.getElementById(`m-step-${i}`);
        if (mContainer) mContainer.innerHTML = document.getElementById(`tpl-step-${i}`).innerHTML;
      }

      for (let i = 1; i <= 5; i++) {
        const dDevice = document.getElementById(`d-device-${i}`);
        if (dDevice) dDevice.innerHTML = statusBarHtml + document.getElementById(`tpl-step-${i}`).innerHTML + homeBarHtml;
      }

      const mStep5Decor = document.querySelectorAll('#m-step-5 .desktop-only-decor');
      mStep5Decor.forEach(el => el.remove());
    }

    // Điều hướng bước Mobile
    function goToStep(step) {
      if (step < 1 || step > totalSteps) return;
      currentStep = step;

      for (let i = 1; i <= totalSteps; i++) {
        const el = document.getElementById(`m-step-${i}`);
        if (el) el.classList.toggle('hidden', i !== currentStep);
      }

      const dock = document.getElementById('m-bottom-dock');
      const fab = document.getElementById('m-fab-plus');
      if (dock && fab) {
        const isDockStep = (currentStep === 1 || currentStep === 5);
        dock.classList.toggle('hidden', !isDockStep);
        fab.classList.toggle('hidden', !isDockStep);
      }

      const progressPercent = (currentStep / totalSteps) * 100;
      document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;
      document.getElementById('step-indicator-text').innerText = translations[currentLang].steps[currentStep - 1];
      document.getElementById('step-percentage-text').innerText = `${progressPercent}%`;

      document.getElementById('nav-btn-prev').disabled = (currentStep === 1);
      document.getElementById('nav-btn-next').disabled = (currentStep === totalSteps);

      const currentSection = document.getElementById(`m-step-${currentStep}`);
      if (currentSection) {
        const mainEl = currentSection.querySelector('main');
        if (mainEl) mainEl.scrollTop = 0;
      }
    }

    function navigateStep(direction) {
      goToStep(currentStep + direction);
    }

    // Xử lý vuốt trên Mobile
    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
    const gestureZone = document.getElementById('screen-stage');

    gestureZone.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    gestureZone.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 45) {
        if (deltaX < 0 && currentStep < totalSteps) navigateStep(1);
        else if (deltaX > 0 && currentStep > 1) navigateStep(-1);
      }
    }, { passive: true });

    // Dữ liệu giả định an toàn
    const dummyData = {
      canhan: { stk: '868xxxxxxx', chutaikhoan: 'NGUYEN VAN A', sdt: '0912xxxxxx', dinhdanh: '001095012345' },
      doanhnghiep: { stk: '868xxxxxxx', chutaikhoan: 'CONG TY CP CONG NGHE V-SOLUTION', sdt: '0912xxxxxx', dinhdanh: '0108999888', merchantId: 'Vui lòng liên hệ Tingo Pay' },
      hokinhdoanh: { stk: '868xxxxxxx', chutaikhoan: 'HO KINH DOANH PHO NGON TAM HOA', sdt: '0912xxxxxx', dinhdanh: '001080099887' }
    };

    function selectAccountType(type) {
      document.querySelectorAll('.tab-canhan').forEach(b => b.classList.toggle('active', type === 'canhan'));
      document.querySelectorAll('.tab-doanhnghiep').forEach(b => b.classList.toggle('active', type === 'doanhnghiep'));
      document.querySelectorAll('.tab-hokinhdoanh').forEach(b => b.classList.toggle('active', type === 'hokinhdoanh'));

      const data = dummyData[type];
      document.querySelectorAll('.input-stk').forEach(i => i.value = data.stk);
      document.querySelectorAll('.input-chutaikhoan').forEach(i => i.value = data.chutaikhoan);
      document.querySelectorAll('.input-sdt').forEach(i => i.value = data.sdt);
      document.querySelectorAll('.input-dinhdanh').forEach(i => i.value = data.dinhdanh);

      document.querySelectorAll('.field-merchant').forEach(f => {
        f.classList.toggle('hidden', type !== 'doanhnghiep');
        if (type === 'doanhnghiep') {
          f.querySelector('input').value = data.merchantId;
        }
      });
    }

    let isAgreed = true;
    function toggleAgreeCheckbox() {
      isAgreed = !isAgreed;
      document.querySelectorAll('.check-icon').forEach(icon => {
        if (isAgreed) {
          icon.className = "check-icon w-5 h-5 rounded-full bg-[#007aff] flex items-center justify-center text-white text-[11px] shadow-2xs";
          icon.innerHTML = '<i class="fa-solid fa-check"></i>';
        } else {
          icon.className = "check-icon w-5 h-5 rounded-full border-2 border-slate-300 bg-white flex items-center justify-center text-transparent text-[11px]";
          icon.innerHTML = '';
        }
      });
      document.querySelectorAll('.btn-confirm').forEach(btn => {
        btn.classList.toggle('opacity-50', !isAgreed);
        btn.classList.toggle('pointer-events-none', !isAgreed);
      });
    }

    // Tự động phát hiện thiết bị và scale màn hình tối ưu
    function handleDeviceDetectionAndScale() {
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      isDesktopMode = (screenW >= 1024);

      const mobileRoot = document.getElementById('mobile-view-root');
      const desktopRoot = document.getElementById('desktop-view-root');

      if (isDesktopMode) {
        mobileRoot.style.display = 'none';
        desktopRoot.style.display = 'flex';
        desktopRoot.style.flexDirection = 'column';

        const headerBar = document.getElementById('desktop-header-bar');
        const canvas = document.getElementById('desktop-canvas');

        // Khung chuẩn desktop rộng 2400px x cao 1030px (bao gồm nhãn to rõ)
        const baseCanvasWidth = 2400;
        const baseCanvasHeight = 1030;

        const availableW = screenW - 40;
        const availableH = screenH - headerBar.offsetHeight - 24;

        const scaleX = availableW / baseCanvasWidth;
        const scaleY = availableH / baseCanvasHeight;
        const scale = Math.min(scaleX, scaleY);

        canvas.style.transform = `scale(${scale})`;
        const renderedHeight = baseCanvasHeight * scale;
        const topOffset = Math.max(10, (availableH - renderedHeight) / 2);
        canvas.style.top = topOffset + 'px';

      } else {
        desktopRoot.style.display = 'none';
        mobileRoot.style.display = 'flex';

        const controlBar = document.getElementById('mobile-control-bar');
        const fit = document.getElementById('screen-fit');
        const stage = document.getElementById('screen-stage');

        const baseWidth = 430;
        const baseHeight = 900;

        const availableWidth = screenW - 12;
        const availableHeight = screenH - controlBar.offsetHeight - 18;

        const scaleX = availableWidth / baseWidth;
        const scaleY = availableHeight / baseHeight;
        const scale = Math.min(scaleX, scaleY, 1);

        stage.style.transform = `scale(${scale})`;
        fit.style.height = (baseHeight * scale) + 'px';
      }
    }

    window.addEventListener('resize', handleDeviceDetectionAndScale);
    window.addEventListener('orientationchange', () => {
      setTimeout(handleDeviceDetectionAndScale, 150);
    });

    window.addEventListener('DOMContentLoaded', () => {
      initializeComponents();
      handleDeviceDetectionAndScale();
      goToStep(1);
      setLanguage('vi');
    });
  </script>
